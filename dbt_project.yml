name: gtm_warehouse
version: "1.0.0"
profile: gtm_warehouse

model-paths: ["models"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
test-paths: ["tests/dbt"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  raw_dir: "raw/latest"
  reply_lookback_days: 14

models:
  gtm_warehouse:
    staging:
      +materialized: view
      +schema: staging
    dims:
      +materialized: table
    facts:
      +materialized: table
    marts:
      +materialized: table
